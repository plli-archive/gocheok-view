<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOCHEOK VIEW</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1027;color:#eef0ff;font:15px system-ui}main{max-width:1050px;margin:auto;padding:20px}header,section{background:#181e3b;border:1px solid #33395c;border-radius:16px;padding:18px;margin-bottom:16px}h1{margin:8px 0;font-size:32px}small,p{color:#bfc5e0}button,input,select,textarea{font:inherit;border:1px solid #555d83;border-radius:8px;padding:10px;background:#252c4c;color:white}button{cursor:pointer}button.primary{background:#7763e8}input,select,textarea{max-width:100%}label{display:block;margin:10px 0}label input,label select,label textarea{display:block;width:100%;margin-top:5px} .layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.map{position:relative}.map img{width:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);width:3.7%;height:3%;padding:0;border:0;background:transparent;border-radius:4px}.pin.has{outline:2px solid #54e4a8}.pin.active{outline:3px solid #ffd36c;background:#ffd36c44}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{background:#252c4c;border-radius:10px;overflow:hidden;padding-bottom:8px}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}.photo div{padding:8px;white-space:pre-wrap;overflow-wrap:anywhere}.photo button{margin:4px;font-size:12px}dialog{background:#181e3b;color:white;border:1px solid #555;border-radius:12px;max-width:94vw;width:440px}dialog img{max-width:100%;max-height:80vh}#zoom{width:auto} [hidden]{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding:10px}h1{font-size:26px}}
</style><main><header><small>2025 PLAVE CONCERT · SEAT ARCHIVE</small><h1>GOCHEOK VIEW ✦</h1><p>플리와 함께 기록하는 고척돔 시야</p><button id="login">관리자 로그인</button> <button id="logout" hidden>로그아웃</button><button id="submitPhoto" class="primary">+ 시야 사진 제보</button> <button id="pendingBtn" hidden>제보 승인 관리</button><p id="status" role="status"></p><strong id="stats">0장 · 0구역</strong></header><div class="layout"><section><h2>좌석 배치도</h2><small>구역 번호를 터치하세요 · 초록 테두리: 등록됨</small><div class="map" id="map"><img src="seats.jpg" alt="2025 고척돔 원본 좌석표"></div></section><section><h2 id="heading">전체 시야</h2><select id="filter"></select> <button id="add" class="primary" hidden>+ 사진 등록</button><p id="empty">등록된 사진이 없습니다.</p><div class="gallery" id="gallery"></div></section></div><section id="pendingPanel" hidden><h2>승인 대기 사진</h2><button id="refreshPending">새로고침</button><div id="pendingList" class="gallery"></div></section></main><dialog id="auth"><form id="authform"><h2>관리자 로그인</h2><label>이메일<input id="email" type="email" required></label><label>비밀번호<input id="password" type="password" required></label><div id="authCaptcha"></div><button class="primary">로그인</button> <button type="button" onclick="auth.close()">취소</button></form></dialog><dialog id="editor"><form id="form"><h2>시야 사진 관리</h2><label>구역<select id="section" required></select></label><label>열<input id="row" maxlength="30"></label><label>좌석 번호<input id="number" maxlength="30"></label><label id="filelabel">사진 (최대 5장)<input id="files" type="file" accept="image/*" multiple></label><label>관람 후기<textarea id="review" maxlength="1000"></textarea></label><label id="consentLabel" hidden><input style="display:inline;width:auto" type="checkbox" id="consent"> 직접 촬영했거나 공개 허락을 받은 사진입니다.</label><div id="captchaArea" hidden></div><button class="primary" id="save">저장</button> <button type="button" onclick="editor.close()">취소</button></form></dialog><dialog id="zoom"><button onclick="zoom.close()">닫기</button><br><img id="large" alt="시야 확대"></dialog><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><script src="config.js?v=turnstile1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id), cfg=window.CONFIG, db=cfg.url&&cfg.key&&window.supabase?supabase.createClient(cfg.url,cfg.key):null;let admin=false,records=[],editing=null,submitting=false,captchaToken="",captchaWidget=null;const coords={};function series(prefix,start,pts){pts.forEach((p,i)=>coords[prefix+(start+i)]=p)}
series('F',1,[[250,350],[338,350],[430,350],[525,350],[618,350],[710,350],[804,350],[895,350],[315,491],[410,522],[516,522],[623,522],[731,522],[825,491],[389,624],[452,656],[690,656],[750,624]]);
series('',101,[[1024,432],[1000,480],[973,510],[948,550],[911,594],[876,636],[851,685],[284,681],[267,632],[226,593],[193,550],[167,508],[144,479],[118,435]]);series('',201,[[1044,543],[1011,595],[976,638],[944,683],[900,724],[240,726],[194,683],[163,640],[129,595],[100,546]]);
series('T0',1,[[797,759],[739,833],[680,882],[568,897],[457,882],[398,835],[338,761]]);Object.assign(coords,{T11:[849,793],T12:[785,868],T13:[727,916],T15:[410,916],T16:[359,871],T17:[298,795]});
series('',301,[[1017,681],[987,719],[955,761],[917,807],[884,851],[851,893],[825,931],[795,963],[740,1002],[657,1032],[591,1040],[547,1040],[483,1032],[396,1003],[342,964],[315,931],[286,894],[254,851],[222,809],[187,762],[151,719],[123,681]]);
series('',401,[[1036,739],[1004,799],[976,849],[943,894],[911,936],[880,979],[847,1022],[805,1056],[758,1080],[705,1105],[651,1116],[596,1123],[542,1123],[487,1116],[431,1105],[382,1083],[336,1057],[291,1022],[255,981],[224,939],[196,895],[165,848],[137,799],[104,735]]);
const ids=Object.keys(coords).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));for(const id of ids){for(const target of ['filter','section'])$(target).add(new Option(id+' 구역',id));const p=document.createElement('button');p.className='pin';p.title=id+' 구역';p.setAttribute('aria-label',p.title);p.style.left=coords[id][0]/1171*100+'%';p.style.top=coords[id][1]/1280*100+'%';p.dataset.id=id;p.onclick=()=>{$('filter').value=id;render();$('heading').scrollIntoView({block:'nearest'})};$('map').append(p)}$('filter').add(new Option('전체 구역',''),0);$('filter').value='';$('filter').onchange=render;
function status(s){$('status').textContent=s}function check(e){if(e)throw e}function render(){const id=$('filter').value,areas=new Set(records.map(r=>r.section));$('stats').textContent=records.length+'장 · '+areas.size+'구역';$('heading').textContent=id?id+' 구역 시야':'전체 시야';document.querySelectorAll('.pin').forEach(p=>{p.classList.toggle('has',areas.has(p.dataset.id));p.classList.toggle('active',p.dataset.id===id)});$('gallery').replaceChildren();const list=records.filter(r=>!id||r.section===id);$('empty').hidden=!!list.length;for(const r of list){const card=document.createElement('article');card.className='photo';const im=document.createElement('img');im.loading='lazy';im.src=db.storage.from('seat-photos').getPublicUrl(r.path).data.publicUrl;im.alt=r.section+' 시야';im.onclick=()=>{$('large').src=im.src;$('zoom').showModal()};const t=document.createElement('div');t.textContent=[r.section+' 구역',r.seat_row,r.seat_number].filter(Boolean).join(' · ')+'\n'+(r.review||'');card.append(im,t);if(admin){for(const [name,fn] of [['수정',()=>edit(r)],['삭제',()=>remove(r)]]){const b=document.createElement('button');b.textContent=name;b.onclick=fn;card.append(b)}}$('gallery').append(card)}}
async function load(){if(!db)return;try{let all=[],from=0;while(true){const {data,error}=await db.from('views').select('*').order('created_at',{ascending:false}).order('id').range(from,from+499);check(error);all.push(...data);if(data.length<500)break;from+=500}records=all;render()}catch(e){status(e.message)}}
function session(s){admin=!!s&&s.user.id===cfg.adminUid;$('pendingBtn').hidden=!admin;if(!admin)$('pendingPanel').hidden=true;$('add').hidden=!admin;$('logout').hidden=!admin;$('login').hidden=admin;render()}
let authToken='',authWidget=null; function mountCaptcha(target,cb){if(!window.turnstile){alert('보안 인증 로딩 중입니다. 잠시 후 창을 다시 열어 주세요.');return null}return turnstile.render(target,{sitekey:cfg.captchaSiteKey,callback:cb,'expired-callback':()=>cb(''),'error-callback':()=>cb('')})} $('login').onclick=()=>{if(!db)return;authToken='';$('auth').showModal();if(authWidget!==null)turnstile.remove(authWidget);authWidget=mountCaptcha('#authCaptcha',t=>authToken=t)};$('authform').onsubmit=async e=>{e.preventDefault();if(!authToken){alert('보안 인증을 완료해 주세요.');return} const token=authToken;authToken='';const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value,options:{captchaToken:token}});if(authWidget!==null)turnstile.reset(authWidget);if(error){alert(error.message);return}if(data.user.id!==cfg.adminUid){await db.auth.signOut();alert('관리자 계정이 아닙니다.');return}$('password').value='';$('auth').close();session(data.session)};$('logout').onclick=async()=>{await db.auth.signOut();session(null)};
function edit(r,submit=false){captchaToken='';submitting=submit;editing=r;$('form').reset();$('section').value=r?.section||$('filter').value||ids[0];$('row').value=r?.seat_row||'';$('number').value=r?.seat_number||'';$('review').value=r?.review||'';$('filelabel').hidden=!!r;$('files').required=!r;$('consentLabel').hidden=!submit;$('consent').required=submit;$('filelabel').firstChild.textContent=submit?'사진 (최대 3장)':'사진 (최대 5장)';$('captchaArea').hidden=!submit||!cfg.captchaSiteKey;$('editor').showModal();if(submit&&cfg.captchaSiteKey&&window.turnstile){if(captchaWidget!==null)turnstile.remove(captchaWidget);captchaWidget=turnstile.render('#captchaArea',{sitekey:cfg.captchaSiteKey,callback:t=>captchaToken=t,'expired-callback':()=>captchaToken=''})}}$('add').onclick=()=>edit(null);
async function compress(f){const url=URL.createObjectURL(f);try{const im=new Image();im.src=url;await im.decode();const c=document.createElement('canvas'),s=Math.min(1,1400/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('사진 변환 실패')),'image/jpeg',.72))}finally{URL.revokeObjectURL(url)}}
$('form').onsubmit=async e=>{e.preventDefault();if(!admin&&!submitting)return;const b=$('save');b.disabled=true;try{const fields={section:$('section').value,seat_row:$('row').value,seat_number:$('number').value,review:$('review').value};if(submitting){await submitFiles(fields)}else if(editing){check((await db.from('views').update(fields).eq('id',editing.id)).error)}else{const files=[...$('files').files];if(!files.length||files.length>5)throw Error('사진 1~5장을 선택하세요.');for(const f of files){const blob=await compress(f),path=crypto.randomUUID()+'.jpg';check((await db.storage.from('seat-photos').upload(path,blob,{contentType:'image/jpeg'})).error);const {error}=await db.from('views').insert({...fields,path});if(error){await db.storage.from('seat-photos').remove([path]);throw error}}}$('editor').close();await load();status(submitting?'제보 완료 · 관리자 승인 후 공개됩니다.':'저장 완료')}catch(e){alert(e.message);await load()}finally{b.disabled=false}};
async function remove(r){if(!admin||!confirm('사진을 삭제할까요?'))return;try{check((await db.from('views').delete().eq('id',r.id)).error);check((await db.storage.from('seat-photos').remove([r.path])).error);await load()}catch(e){alert(e.message);await load()}}
$('submitPhoto').onclick=()=>{if(admin)return edit(null);edit(null,true)};
async function smallPhoto(f){let b=await compress(f);if(b.size<=350000)return b;const u=URL.createObjectURL(b);try{const im=new Image();im.src=u;await im.decode();const c=document.createElement('canvas');for(const max of [1100,900,700,500]){const k=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);b=await new Promise(r=>c.toBlob(r,'image/jpeg',.65));if(b&&b.size<=350000)return b}throw Error('사진 압축 실패')}finally{URL.revokeObjectURL(u)}}
async function submitFiles(fields){const fs=[...$('files').files];if(!fs.length||fs.length>3||!$('consent').checked)throw Error('사진 1~3장과 공개 동의를 확인하세요.');if(admin){throw Error('관리자는 사진 등록 버튼을 사용하세요.')}let {data:{session:s}}=await db.auth.getSession();if(!s){if(!cfg.captchaSiteKey||!captchaToken)throw Error('로봇 방지 인증 설정 또는 인증 완료가 필요합니다.');const res=await db.auth.signInAnonymously({options:{captchaToken}});captchaToken='';if(captchaWidget!==null)turnstile.reset(captchaWidget);check(res.error);s=res.data.session}if(!s?.user?.is_anonymous)throw Error('익명 인증이 필요합니다.');let n=0;for(const f of fs){try{const blob=await smallPhoto(f),id=crypto.randomUUID(),path=s.user.id+'/'+id+'.jpg';check((await db.from('photo_submissions').insert({...fields,id})).error);check((await db.storage.from('pending-photos').upload(path,blob,{contentType:'image/jpeg'})).error);n++}catch(e){throw Error(n+'장 제보 완료. 나머지 실패: '+e.message)}}}
$('pendingBtn').onclick=()=>{$('pendingPanel').hidden=!$('pendingPanel').hidden;if(!$('pendingPanel').hidden)loadPending()};$('refreshPending').onclick=loadPending;
async function loadPending(){if(!admin)return;const list=$('pendingList');list.textContent='불러오는 중';try{const {data,error}=await db.from('photo_submissions').select('*').order('created_at');check(error);list.replaceChildren();if(!data.length)list.textContent='승인 대기 사진 없음';for(const r of data){const path=r.owner_id+'/'+r.id+'.jpg',card=document.createElement('article');card.className='photo';const signed=await db.storage.from('pending-photos').createSignedUrl(path,300);if(!signed.error){const im=document.createElement('img');im.src=signed.data.signedUrl;im.onclick=()=>{$('large').src=im.src;$('zoom').showModal()};card.append(im)}const t=document.createElement('div');t.textContent=[r.section,r.seat_row,r.seat_number,r.review].join(' · ');card.append(t);for(const [label,approve] of [['승인',true],['거절/삭제',false]]){const b=document.createElement('button');b.textContent=label;b.disabled=approve&&!!signed.error;b.onclick=async()=>{if(!confirm(label+'할까요?'))return;for(const x of card.querySelectorAll('button'))x.disabled=true;try{if(approve){const {data:blob,error}=await db.storage.from('pending-photos').download(path);check(error);const dest=r.id+'.jpg';check((await db.storage.from('seat-photos').upload(dest,blob,{contentType:'image/jpeg',upsert:true})).error);const {data:existing,error:err}=await db.from('views').select('id').eq('id',r.id).maybeSingle();check(err);if(!existing)check((await db.from('views').insert({id:r.id,section:r.section,seat_row:r.seat_row,seat_number:r.seat_number,review:r.review,path:dest})).error)}check((await db.storage.from('pending-photos').remove([path])).error);check((await db.from('photo_submissions').delete().eq('id',r.id)).error);await load();await loadPending()}catch(e){alert(e.message);await loadPending()}};card.append(b)}list.append(card)}}catch(e){list.textContent=e.message}}
if(db){db.auth.getSession().then(({data})=>session(data.session));db.auth.onAuthStateChange((event,s)=>session(s));load();window.addEventListener('focus',load)}else status('연결 전 미리보기 · Supabase 설정 후 사진 등록 및 공유 가능');render();
</script></html>
